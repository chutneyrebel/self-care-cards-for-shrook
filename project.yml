name: SelfCareCards
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  SelfCareCards:
    type: application
    platform: iOS
    sources:
      - path: ios/SelfCareCards/Sources
      - path: cards.json
        buildPhase: resources
      - path: source-decks.json
        buildPhase: resources
      - path: ios-jung-quotes.json
        buildPhase: resources
      - path: jung-reflections.json
        buildPhase: resources
      - path: ios/SelfCareCards/Assets.xcassets
        buildPhase: resources
      - path: ios/SelfCareCards/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chutneyrebel.selfcarecards
        INFOPLIST_FILE: ios/SelfCareCards/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
